name: Prepare AutoFirma ecosystem contribution

on:
  push:
    branches:
      - add-autofirma-ecosystem
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-autofirma-ecosystem

      - name: Add AutoFirma ecosystem projects
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          entries = {
              "autofirma-client": '- [autofirma-client](https://github.com/erseco/autofirma-client) [![Stars](https://img.shields.io/github/stars/erseco/autofirma-client?style=flat-square&label=%E2%AD%90)](https://github.com/erseco/autofirma-client/stargazers) [![Last Commit](https://img.shields.io/github/last-commit/erseco/autofirma-client?style=flat-square)](https://github.com/erseco/autofirma-client/commits/main) [![Language](https://img.shields.io/github/languages/top/erseco/autofirma-client?style=flat-square)](https://github.com/erseco/autofirma-client) [![License](https://img.shields.io/github/license/erseco/autofirma-client?style=flat-square)](https://github.com/erseco/autofirma-client/blob/main/LICENSE) [![AutoFirma](https://img.shields.io/badge/AutoFirma-c60b1e?style=flat-square)](https://firmaelectronica.gob.es/Home/Descargas.html) [![SEAP](https://img.shields.io/badge/SEAP-c60b1e?style=flat-square)](https://administracion.gob.es/) - Cliente TypeScript para integrar la API oficial AutoScript y AutoFirma en aplicaciones web con promesas, tipado y errores normalizados.',
              "autofirma-intermediate-server": '- [autofirma-intermediate-server](https://github.com/erseco/autofirma-intermediate-server) [![Stars](https://img.shields.io/github/stars/erseco/autofirma-intermediate-server?style=flat-square&label=%E2%AD%90)](https://github.com/erseco/autofirma-intermediate-server/stargazers) [![Last Commit](https://img.shields.io/github/last-commit/erseco/autofirma-intermediate-server?style=flat-square)](https://github.com/erseco/autofirma-intermediate-server/commits/main) [![Language](https://img.shields.io/github/languages/top/erseco/autofirma-intermediate-server?style=flat-square)](https://github.com/erseco/autofirma-intermediate-server) [![License](https://img.shields.io/github/license/erseco/autofirma-intermediate-server?style=flat-square)](https://github.com/erseco/autofirma-intermediate-server/blob/main/LICENSE) [![AutoFirma](https://img.shields.io/badge/AutoFirma-c60b1e?style=flat-square)](https://firmaelectronica.gob.es/Home/Descargas.html) [![SEAP](https://img.shields.io/badge/SEAP-c60b1e?style=flat-square)](https://administracion.gob.es/) - Servidor intermedio PHP para el protocolo de almacenamiento y recuperación temporal usado por AutoScript y AutoFirma, especialmente en flujos móviles.',
              "fpdf-autofirma": '- [fpdf-autofirma](https://github.com/erseco/fpdf-autofirma) [![Stars](https://img.shields.io/github/stars/erseco/fpdf-autofirma?style=flat-square&label=%E2%AD%90)](https://github.com/erseco/fpdf-autofirma/stargazers) [![Last Commit](https://img.shields.io/github/last-commit/erseco/fpdf-autofirma?style=flat-square)](https://github.com/erseco/fpdf-autofirma/commits/main) [![Language](https://img.shields.io/github/languages/top/erseco/fpdf-autofirma?style=flat-square)](https://github.com/erseco/fpdf-autofirma) [![License](https://img.shields.io/github/license/erseco/fpdf-autofirma?style=flat-square)](https://github.com/erseco/fpdf-autofirma/blob/main/LICENSE) [![AutoFirma](https://img.shields.io/badge/AutoFirma-c60b1e?style=flat-square)](https://firmaelectronica.gob.es/Home/Descargas.html) [![SEAP](https://img.shields.io/badge/SEAP-c60b1e?style=flat-square)](https://administracion.gob.es/) - Extensión PHP de FPDF para definir áreas de firma PAdES visibles y generar los parámetros que AutoFirma necesita para firmar desde el navegador.',
              "wp-autofirma": '- [wp-autofirma](https://github.com/erseco/wp-autofirma) [![Stars](https://img.shields.io/github/stars/erseco/wp-autofirma?style=flat-square&label=%E2%AD%90)](https://github.com/erseco/wp-autofirma/stargazers) [![Last Commit](https://img.shields.io/github/last-commit/erseco/wp-autofirma?style=flat-square)](https://github.com/erseco/wp-autofirma/commits/main) [![Language](https://img.shields.io/github/languages/top/erseco/wp-autofirma?style=flat-square)](https://github.com/erseco/wp-autofirma) [![License](https://img.shields.io/github/license/erseco/wp-autofirma?style=flat-square)](https://github.com/erseco/wp-autofirma/blob/main/LICENSE) [![AutoFirma](https://img.shields.io/badge/AutoFirma-c60b1e?style=flat-square)](https://firmaelectronica.gob.es/Home/Descargas.html) [![SEAP](https://img.shields.io/badge/SEAP-c60b1e?style=flat-square)](https://administracion.gob.es/) - Plugin de WordPress para firmar documentos PDF de la biblioteca de medios con AutoFirma y guardar el resultado firmado.',
          }

          for name in entries:
              if f"https://github.com/erseco/{name}" in text:
                  raise SystemExit(f"{name} already exists in README.md")

          def find(prefix: str) -> int:
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      return index
              raise SystemExit(f"Anchor not found: {prefix}")

          lines.insert(find("- [autofirma-docker]("), entries["autofirma-client"])
          lines.insert(find("- [autofirma-nix]("), entries["autofirma-intermediate-server"])
          lines.insert(find("- [integra]("), entries["fpdf-autofirma"])
          lines.insert(find("- [portafirmas-android](") + 1, entries["wp-autofirma"])

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate contribution
        run: |
          git diff --check
          python3 lint.py --strict

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Añadir proyectos del ecosistema AutoFirma"
          git push origin HEAD:add-autofirma-ecosystem
