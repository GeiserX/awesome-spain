name: links-changed

# A pull request may only add links that work. The check itself lives in
# awesome-lint-extra (links-changed/action.yml), shared by every list, so a
# change to it lands once. It checks just the lines this PR adds or changes
# in README.md, so a site that is down for a moment somewhere else in the
# list never blocks an unrelated PR. The whole list is checked once a week
# from outside this repo, which keeps one open issue titled "Dead links".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  links-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: GeiserX/awesome-lint-extra/links-changed@main
