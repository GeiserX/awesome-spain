# Generated from mkdocs.yml by mkdocs-to-zensical.py; the why of every block is in
# new-repo/templates/zensical.toml. Edit this file, not mkdocs.yml, which is gone.

[project]
site_name = "Awesome Spain"
site_url = "https://geiserx.github.io/awesome-spain/"
site_description = "Una selección de software open source que da soporte específico a España, sus administraciones, instituciones y servicios públicos."
repo_url = "https://github.com/GeiserX/awesome-spain"
repo_name = "GeiserX/awesome-spain"
strict = true
extra_css = ["stylesheets/theme.css"]
exclude_docs = """
[A-Z]*.md
design/
research/
notes/
hooks/
requirements-docs.txt
limpieza-2026-09.tsv
"""
nav = [
  { "Awesome Spain" = "index.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "es"
variant = "modern"
custom_dir = "overrides"
logo = "images/logo.svg"
favicon = "images/icon.svg"
font = false
features = [
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo oscuro"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GeiserX/awesome-spain"

[project.plugins.search]

[project.markdown_extensions]
"docs.hooks.awesome_site" = {}
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets".base_path = [".", "docs"]
"pymdownx.snippets".check_paths = true
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
attr_list = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 2, slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } } }
