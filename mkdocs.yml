# One-page site: docs/index.md holds a short home block and then includes the
# list from README.md (section marker `lista`), so the list stays the single
# source that awesome-lint-extra governs. Never copy the list into docs/.
site_name: Awesome Spain
site_url: https://geiserx.github.io/awesome-spain/
site_description: Una selección de software open source que da soporte específico a España, sus administraciones, instituciones y servicios públicos.
repo_url: https://github.com/GeiserX/awesome-spain
repo_name: GeiserX/awesome-spain

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: es
  # Both drawn from the banner's windmill, see docs/images/logo.svg and icon.svg.
  logo: images/logo.svg
  favicon: images/icon.svg
  # overrides/main.html adds the Open Graph tags (social preview image).
  custom_dir: overrides
  # Dark first: the first palette entry is the default, and the banner is dark.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  # One page: no tabs, no sections. No edit button either, because the page
  # file is a home block plus an include; entries are edited in README.md.
  # toc.follow keeps the right-hand index on the category being read on a
  # 379-entry page; navigation.tracking puts that category in the URL so a
  # visitor can share a link to it.
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it. For
# this site the one that matters is links.anchors: every entry of the
# Contenido list and every card must land on a real section heading.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search:
      lang: es

# Build-time counts for the home page, lazy loading for the 2,100 badge
# images, and a check that the list really came through the include.
hooks:
  - docs/hooks/site.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # docs/index.md includes README.md from the `lista` section marker. base_path
  # includes the repository root; check_paths makes a renamed or missing README
  # fail the build, and also a missing section marker (SnippetMissingError,
  # "Snippet section lista could not be located"). The hook above is a second
  # guard: it fails the build if the markers exist but enclose the wrong lines.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  # Material icons in the home page cards (:material-magnify: and friends).
  # README.md has no :shortcode: text today; `grep -oE ':[a-z_]+:' README.md`
  # must stay empty or an entry description could turn into an emoji.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  # Renders the home page's grid cards and the README's HTML blocks.
  - md_in_html
  - tables
  # GitHub-style anchors keep accents (#cartografía-y-catastro). The default
  # slugify strips them and every accented Contenido link would miss.
  # toc_depth 2: the right-hand index lists the 36 categories only. With the
  # H3s (17 comunidades autónomas among them) it ran to 80 lines and the
  # categories fell off the first screen.
  - toc:
      permalink: true
      toc_depth: 2
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/awesome-spain

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every file in docs/,
# so anything that is not part of the site must be listed here.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  hooks/
  requirements-docs.txt
  limpieza-2026-09.tsv

nav:
  - Awesome Spain: index.md
